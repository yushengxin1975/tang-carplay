name: Build PC unit tests + Windows host toolchain
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test-pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 (g++17, LLVM-MinGW UCRT - includes g++.exe)
        shell: pwsh
        run: |
          Write-Host "Installing LLVM-MinGW (includes g++)..."
          winget install --id=MartinStorsjo.LLVM-MinGW.UCRT `
                        --accept-package-agreements `
                        --accept-source-agreements `
                        --silent `
                        --force `
          || { Write-Warning "winget install returned non-zero, checking what's there..." }
          # Find g++.exe in install dir
          $gpp = @(Get-ChildItem -Recurse 'C:\Program Files\LLVM-MinGW\bin' -Filter 'g++.exe' -ErrorAction SilentlyContinue |
                 Select-Object -First 1)
          if (-not $gpp) {
            # Try older install
            $gpp = @(Get-ChildItem -Recurse 'C:\mingw64\bin' -Filter 'g++.exe' -ErrorAction SilentlyContinue |
                   Select-Object -First 1)
          }
          if (-not $gpp) {
            # Try GitHub Actions default Linux mingw fallback
            Write-Error "g++ not found in standard locations. Failing."
          }
          Write-Host "g++ path: $($gpp.FullName)"
          "GPP=$($gpp.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GPP=$($gpp.FullName)" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        env:
            GPP: ${{ env.GPP }}
        run: |
          $env:PATH = "$env:GPP;$env:PATH"
          cd $env:GITHUB_WORKSPACE
          & g++ -std=c++17 -O2 -g -Wall -Iclient/include -Iclient/cpp `
              client/cpp/protocol/aes_sbox_data.cpp `
              client/cpp/protocol/connection.cpp `
              client/test/test_protocol.cpp `
              -o build/test.exe
          Write-Host "build rc=$LASTEXITCODE"
          if (Test-Path build/test.exe) { Write-Host "test.exe OK $([math]::Round((Get-Item build/test.exe).Length/1KB,1)) KB" }

      - name: Run tests
        shell: pwsh
        run: |
          cd $env:GITHUB_WORKSPACE
          ./build/test.exe | Tee-Object -FilePath test.log
          Write-Host "tests rc=$LASTEXITCODE"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-unit-test-${{ github.run_id }}
          path: |
            build/test.exe
            test.log
        if-no-files-found: ignore