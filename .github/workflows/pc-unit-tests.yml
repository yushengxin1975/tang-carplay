name: Build PC unit tests + pc_main
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test-pc:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install g++
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then choco install mingw -y || true
          else sudo apt-get update && sudo apt-get install -y g++ libusb-1.0-0
          fi
      - name: Unit tests + pc_main
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            CXX="C:/mingw64/bin/g++.exe"
            [ -f "$CXX" ] || CXX="C:/ProgramData/chocolatey/lib/mingw/tools/install/bin/g++.exe"
            [ -f "$CXX" ] || CXX="C:/msys64/mingw64/bin/g++.exe"
            [ -f "$CXX" ] || CXX="g++"
          else
            CXX="g++"
          fi
          echo "Using compiler: $CXX"
          mkdir -p build

          EXTRA_LIBS=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_LIBS="-lws2_32"
          fi

          # Unit tests
          "$CXX" -std=c++17 -O2 -g -Wall \
            -Iclient/include -Iclient/cpp \
            client/cpp/protocol/aes_sbox_data.cpp \
            client/cpp/protocol/connection.cpp \
            client/cpp/protocol/usb_transport.cpp \
            client/test/test_protocol.cpp \
            $EXTRA_LIBS \
            -o build/test.exe
          ./build/test.exe | tee test.log

          # PC main (protocol bring-up tool, static link to avoid DLL hell)
          "$CXX" -std=c++17 -O2 -g -Wall -static \
            -Iclient/include -Iclient/cpp \
            client/cpp/protocol/aes_sbox_data.cpp \
            client/cpp/protocol/connection.cpp \
            client/cpp/protocol/usb_transport.cpp \
            client/cpp/pc_main.cpp \
            $EXTRA_LIBS \
            -o build/pc_main
          ls -la build/
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-${{ matrix.os }}-${{ github.run_id }}
          path: |
            build/test.exe
            build/pc_main*
            test.log
          if-no-files-found: ignore