name: Build PC unit tests + pc_main
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test-pc:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install g++
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then choco install mingw -y || true
          else sudo apt-get update && sudo apt-get install -y g++ libusb-1.0-0
          fi
      - name: Unit tests + pc_main
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            CXX="C:/mingw64/bin/g++.exe"
            [ -f "$CXX" ] || CXX="C:/ProgramData/chocolatey/lib/mingw/tools/install/bin/g++.exe"
            [ -f "$CXX" ] || CXX="C:/msys64/mingw64/bin/g++.exe"
            [ -f "$CXX" ] || CXX="g++"
          else
            CXX="g++"
          fi
          echo "Using compiler: $CXX"
          mkdir -p build

          EXTRA_LIBS=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_LIBS="-lws2_32 -lwinmm"
          fi

          # Unit tests
          "$CXX" -std=c++17 -O2 -g -Wall \
            -Iclient/include -Iclient/cpp \
            client/cpp/protocol/aes_sbox_data.cpp \
            client/cpp/protocol/connection.cpp \
            client/cpp/protocol/usb_transport.cpp \
            client/test/test_protocol.cpp \
            $EXTRA_LIBS \
            -o build/test.exe
          ./build/test.exe | tee test.log

          # PC main (protocol bring-up tool, static link to avoid DLL hell)
          "$CXX" -std=c++17 -O2 -g -Wall -static \
            -Iclient/include -Iclient/cpp \
            client/cpp/protocol/aes_sbox_data.cpp \
            client/cpp/protocol/connection.cpp \
            client/cpp/protocol/usb_transport.cpp \
            client/cpp/pc_main.cpp \
            $EXTRA_LIBS \
            -o build/pc_main
          ls -la build/
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-${{ matrix.os }}-${{ github.run_id }}
          path: |
            build/test.exe
            build/pc_main*
            test.log
          if-no-files-found: ignore

  # PC-side box simulator rig: runs the REAL production CE transport code
  # path (UsbTransport_CE + libBoxUSB load + trailing-byte strip fix +
  # reader loop + Connection state machine + self-heal) against box_sim.exe
  # over TCP — no head unit, no dongle, no WinCE emulator needed.
  sim-pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install g++
        shell: bash
        run: choco install mingw -y || true
      - name: Build box_sim + libBoxUSB_sim.dll + sim_main
        shell: bash
        run: |
          CXX="C:/mingw64/bin/g++.exe"
          [ -f "$CXX" ] || CXX="C:/ProgramData/chocolatey/lib/mingw/tools/install/bin/g++.exe"
          [ -f "$CXX" ] || CXX="C:/msys64/mingw64/bin/g++.exe"
          [ -f "$CXX" ] || CXX="g++"
          echo "Using compiler: $CXX"
          mkdir -p build/sim

          # box_sim.exe — box-side protocol simulator (fault injection)
          "$CXX" -std=c++17 -O2 -g -Wall \
            -Iclient/include \
            client/sim/box_sim.cpp \
            -lws2_32 \
            -o build/sim/box_sim.exe

          # libBoxUSB.dll — libBoxUSB_sim.dll: drop-in vendor DLL replacement
          # (TCP tunnel to box_sim; host_recv returns N+1 with trailing 0x20)
          "$CXX" -std=c++17 -O2 -g -Wall -shared \
            client/sim/libboxusb_sim.cpp \
            -lws2_32 \
            -o build/sim/libBoxUSB.dll

          # sim_main.exe — production CE transport code path vs the sim
          # (-DCARLINKIT_SIM_CE_TRANSPORT compiles the CE branch on desktop;
          # -ladvapi32 for the Reg* calls in EnsureDriverInstalled)
          "$CXX" -std=c++17 -O2 -g -Wall \
            -DCARLINKIT_SIM_CE_TRANSPORT \
            -Iclient/include -Iclient/cpp \
            client/cpp/protocol/aes_sbox_data.cpp \
            client/cpp/protocol/connection.cpp \
            client/cpp/protocol/usb_transport.cpp \
            client/sim/sim_main.cpp \
            -lws2_32 -ladvapi32 -static \
            -o build/sim/sim_main.exe
          ls -la build/sim/
      - name: Upload sim artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tang-carplay-pc-sim-${{ github.run_id }}
          path: build/sim/
          if-no-files-found: ignore