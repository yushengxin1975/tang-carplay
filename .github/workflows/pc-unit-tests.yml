name: Build PC unit tests
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test-pc:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cxx: g++
            cxxpkg: g++
            cxxinstall: sudo apt-get update && sudo apt-get install -y g++
          - os: windows-latest
            cxx: g++.exe
            cxxpkg: mingw-w64
            cxxinstall: choco install mingw -y
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install g++
        shell: bash
        run: ${{ matrix.cxxinstall }}
      - name: Build and test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            CXX="C:/ProgramData/chocolatey/bin/g++.exe"
            [ -f "$CXX" ] || CXX="C:/ProgramData/chocolatey/lib/mingw/tools/install/bin/g++.exe"
            [ -f "$CXX" ] || CXX="C:/mingw64/bin/g++.exe"
            [ -f "$CXX" ] || CXX="C:/msys64/mingw64/bin/g++.exe"
          else
            CXX="g++"
          fi
          echo "Using compiler: $CXX"
          mkdir -p build
          "$CXX" -std=c++17 -O2 -g -Wall \
            -Iclient/include -Iclient/cpp \
            client/cpp/protocol/aes_sbox_data.cpp \
            client/cpp/protocol/connection.cpp \
            client/test/test_protocol.cpp \
            -o build/test.exe
          ls -la build/
          ./build/test.exe | tee test.log
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-test-${{ matrix.os }}-${{ github.run_id }}
          path: |
            build/test.exe
            test.log
          if-no-files-found: ignore