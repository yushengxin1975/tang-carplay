name: Build PC unit tests
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test-pc:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        shell: powershell
        run: |
          winget install --id=MartinStorsjo.LLVM-MinGW.UCRT --accept-package-agreements --accept-source-agreements --silent

      - name: Build and test
        shell: powershell
        run: |
          $gpp = (Get-ChildItem -Recurse 'C:\Program Files\LLVM-MinGW\bin' -Filter 'g++.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          Write-Host "g++: $gpp"
          # Use cmd.exe /c to run g++ with backslash-continued args (PS line-continuation with backtick is fragile inside YAML/JSON)
          $b = New-Object System.Text.StringBuilder
          [void]$b.Append('"').Append($gpp).Append('" -std=c++17 -O2 -g -Wall -Iclient/include -Iclient/cpp client/cpp/protocol/aes_sbox_data.cpp client/cpp/protocol/connection.cpp client/test/test_protocol.cpp -o build/test.exe')
          $cmd = $b.ToString()
          Write-Host "cmd: $cmd"
          cmd.exe /c $cmd
          if (Test-Path build/test.exe) { Write-Host "BUILD OK" } else { Write-Error "BUILD FAIL" }
          ./build/test.exe | Tee-Object -FilePath test.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-unit-test
          path: |
            build/test.exe
            test.log
          if-no-files-found: ignore