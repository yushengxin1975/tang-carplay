name: Build PC unit tests
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test-pc:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW (LLVM-MinGW UCRT)
        run: |
          winget install --id=MartinStorsjo.LLVM-MinGW.UCRT --accept-package-agreements --accept-source-agreements --silent
        shell: powershell

      - name: Build and test
        run: |
          $gpp = (Get-ChildItem -Recurse 'C:\Program Files\LLVM-MinGW\bin' -Filter 'g++.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          Write-Host "g++: $gpp"
          & $gpp -std=c++17 -O2 -g -Wall -Iclient/include -Iclient/cpp `
              client/cpp/protocol/aes_sbox_data.cpp `
              client/cpp/protocol/connection.cpp `
              client/test/test_protocol.cpp `
              -o build/test.exe
          if (Test-Path build/test.exe) { Write-Host "build OK" } else { Write-Error "build failed" }
          ./build/test.exe | Tee-Object -FilePath test.log
        shell: powershell