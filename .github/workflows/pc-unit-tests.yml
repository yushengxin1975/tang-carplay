name: Build PC unit tests
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test-pc:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        shell: powershell
        run: |
          winget install --id=MartinStorsjo.LLVM-MinGW.UCRT --accept-package-agreements --accept-source-agreements --silent

      - name: Build and test
        shell: powershell
        run: |
          $gpp = (Get-ChildItem -Recurse 'C:\Program Files\LLVM-MinGW\bin' -Filter 'g++.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $gpp) { $gpp = (Get-ChildItem -Recurse 'C:\Program Files\LLVM-MinGW' -Filter 'g++.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          if (-not $gpp) { Write-Error "g++ not found"; exit 1 }
          Write-Host "g++: $gpp"
          # Add LLVM-MinGW bin to PATH for runtime + write the cmd.exe string
          $env:PATH = (Split-Path $gpp) + ';' + $env:PATH
          $args = '-std=c++17 -O2 -g -Wall -Iclient/include -Iclient/cpp client/cpp/protocol/aes_sbox_data.cpp client/cpp/protocol/connection.cpp client/test/test_protocol.cpp -o build/test.exe'
          $cmd = ('"' + $gpp + '" ' + $args)
          Write-Host "cmd: $cmd"
          cmd.exe /c $cmd
          if (Test-Path build/test.exe) { Write-Host "BUILD OK $([math]::Round((Get-Item build/test.exe).Length/1KB,1)) KB" }
          else { Write-Error "BUILD FAIL"; exit 1 }
          ./build/test.exe | Tee-Object -FilePath test.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-unit-test
          path: |
            build/test.exe
            test.log
          if-no-files-found: ignore