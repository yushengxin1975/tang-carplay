name: Build WinCE ARM binaries

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  wince-build:
          name: Build WinCE ARM binaries (probe/usbwatch/bench/usbtest)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/enlyze/windows-ce-build-environment-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build all WinCE tools
        run: |
          chmod +x tools/build_all.sh
          CEGCC_BIN=/opt/cegcc-arm/bin tools/build_all.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tang-carplay-wince
          path: |
            probe/probe.exe
            usbwatch/usbwatch.exe
            bench/bench.exe
            usbtest/usbtest.exe
